name: Deploy Mien Trung Matrix Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Daily Lottery Job]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mien-trung-matrix-pages.yml'
      - 'src/cli/export-mien-trung-frequency-matrix-pages.ts'
      - 'src/http/mien-trung-frequency-matrix.page.ts'
      - 'src/models/MienTrungFrequencyMatrixSnapshot.ts'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mien-trung-matrix-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NODE_ENV: production
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      LOTTERY_SOURCE_BASE_URL: https://xskt.com.vn

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Export matrix snapshots
        run: npm run export:matrix:mien-trung:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
